[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msdp-spatial-watermarking"
version = "0.1.0"
description = "Minimax Spatial Determinant Projection (MSDP), literature baselines and reproducible attacks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "Pillow>=10.0", "numba>=0.60",
  "scikit-image>=0.24", "pandas>=2.2", "opencv-python-headless>=4.8",
  "PyWavelets>=1.5"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qr64_certified.baselines" = ["evidence/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
